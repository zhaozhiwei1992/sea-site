<div class="calc" id="temp-calc">
  <div class="fields">
    <div class="field">
      <label for="tc-celsius">Celsius (°C)</label>
      <input id="tc-celsius" type="number" inputmode="decimal" placeholder="0" autocomplete="off" />
    </div>
    <div class="field">
      <label for="tc-fahrenheit">Fahrenheit (°F)</label>
      <input id="tc-fahrenheit" type="number" inputmode="decimal" placeholder="32" autocomplete="off" />
    </div>
    <div class="field">
      <label for="tc-kelvin">Kelvin (K)</label>
      <input id="tc-kelvin" type="number" inputmode="decimal" placeholder="273.15" autocomplete="off" />
    </div>
  </div>

  <p class="hint">Type in any unit — the others update instantly. Kelvin cannot go below 0 K.</p>
</div>
